<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포리의 방 · 청사진</title>
<meta name="description" content="청사진 마이페이지 — 방 안의 물건을 눌러 기능으로 갑니다.">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/room.css">
</head>
<body class="room-body">

<main class="room">
  <div class="scroller">
    <div class="stage">

      <picture>
        <source srcset="./img/room/room.webp" type="image/webp">
        <img class="bg" src="./img/room/room.jpg" alt="밤의 방. 창밖에 달이 떠 있고 바닥에 하트 러그가 깔려 있다.">
      </picture>

      <!-- ── 가구 (누를 수 없는 것) ───────────────────────────── -->
      <img class="ob o-desk" src="./img/room/desk.png" alt="" aria-hidden="true">

      <!-- ── 누를 수 있는 물건 ────────────────────────────────
           PNG 여백을 잘라둬서 사각 판정으로도 모양에 거의 맞는다. -->
      <button class="ob o-board" data-go="policies" aria-label="정책 모아보기">
        <img src="./img/room/board.png" alt=""></button>

      <button class="ob o-pc" data-go="find" aria-label="정책 찾기">
        <img src="./img/room/pc.png" alt=""></button>

      <button class="ob o-piggy" data-go="credit" aria-label="신용 빌드업">
        <img src="./img/room/piggy.png" alt=""></button>

      <button class="ob o-scope" data-go="invest" aria-label="투자 비교 보기">
        <img src="./img/room/scope.png" alt=""></button>

      <button class="ob o-books" data-go="history" aria-label="히스토리">
        <img src="./img/room/books.png" alt=""></button>

      <button class="ob o-pori" data-go="goal" aria-label="포리에게 목표 말하기">
        <img src="./img/room/pori.png" alt=""></button>

      <!-- ── 망원경이 가리키는 카드 ───────────────────────────── -->
      <button class="dcard" data-go="invest">
        <span class="dc-l">
          <b id="dcTitle">목표를 위해 감수할 위험은</b>
          <i id="dcSub">얼마까지 괜찮을까요?</i>
        </span>
        <span class="dc-d" id="dcDday">D-—</span>
      </button>

      <!-- 서랍이 열리면 방을 살짝 어둡게 한다. 무대 밖에 두면 이 막이
           서랍까지 덮어 눌리지 않는다 — 그래서 무대 안, 서랍 바로 앞이다. -->
      <div class="scrim" id="scrim" hidden></div>

      <!-- ── 책장 서랍 ────────────────────────────────────────
           ☰ 로 여닫는다. 칸에 마우스를 올리면 그 칸 책이 빠져나온다. -->
      <nav class="drawer" id="drawer" aria-label="주요 메뉴">
        <img class="shelf" src="./img/room/shelf_empty.png" alt="" aria-hidden="true">
        <a class="srow r1" href="./index.html"><img src="./img/room/row1.png" alt=""><span>메인</span></a>
        <a class="srow r2" href="./room.html" aria-current="page"><img src="./img/room/row2.png" alt=""><span>마이페이지</span></a>
        <a class="srow r3" href="./app.html#dashboard"><img src="./img/room/row3.png" alt=""><span>내 목표</span></a>
        <a class="srow r4" href="./features.html"><img src="./img/room/row4.png" alt=""><span>기능 설명</span></a>
        <span class="srow r5" aria-hidden="true"><img src="./img/room/row5.png" alt=""></span>
      </nav>

    </div>
  </div>

  <!-- ── 상단 ────────────────────────────────────────────────
       천장 몰딩이 어두워 크림색으로 쓰고 그림자를 깐다. -->
  <header class="topbar">
    <button class="burger" id="burger" aria-label="메뉴 열기" aria-expanded="false"><i></i><i></i><i></i></button>
    <span class="logo">청사진</span>
    <a class="me" href="./app.html#mypage" id="me" aria-label="내 정보"><span id="meInit">·</span></a>
  </header>

  <div class="toast" id="toast" role="status"></div>
</main>

<script type="module">
import { initStore, currentUser, getActiveGoal, getProfile } from './js/store.js';
import { ddayFrom } from './js/calc.js';

await initStore();
const user = await currentUser();
if (!user) { location.replace('./auth.html?mode=login'); }

const profile = await getProfile();
const init = (profile && profile.nickname || '').trim().slice(0, 1);
if (init) document.getElementById('meInit').textContent = init;

/* 망원경 카드 — 목표가 있으면 실제 D-Day 를 띄운다.
   없으면 숫자를 지어내지 않고 목표를 정하라고 말한다. */
const goal = await getActiveGoal();
document.body.dataset.goal = goal ? 'y' : 'n';
if (goal && goal.target_months) {
  const d = ddayFrom(goal.started_on, goal.target_months);
  document.getElementById('dcDday').textContent = d.label;
} else {
  document.getElementById('dcTitle').textContent = '아직 목표가 없어요';
  document.getElementById('dcSub').textContent = '포리를 눌러 알려주세요';
  document.getElementById('dcDday').textContent = 'D-—';
}
</script>
<script type="module" src="./js/room.js"></script>
</body>
</html>
